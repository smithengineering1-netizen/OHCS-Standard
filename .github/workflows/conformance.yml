name: OHCS Conformance Test

on:
  pull_request:
    branches: [ main ]

jobs:
  conformance:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Install MATLAB
      uses: matlab-actions/setup-matlab@v1

    - name: Run KPI Report
      run: |
        matlab -batch "logs = load('vendor/example_vendor_report/logs.mat'); spec = kpi_spec; report = generate_kpi_report(logs, spec); save('report.mat','report');"

    - name: Evaluate PASS/FAIL
      id: evaluate
      run: |
        python3 .github/workflows/evaluate.py > result.txt
        if grep -q "CONFORMANCE: PASS" result.txt; then
          echo "status=PASS" >> $GITHUB_OUTPUT
        else
          echo "status=FAIL" >> $GITHUB_OUTPUT
        fi

    - name: Update badge in README
      if: github.event_name == 'push'
      run: |
        STATUS=${{ steps.evaluate.outputs.status }}
        if [ "$STATUS" = "PASS" ]; then
          BADGE="![OHCS](https://img.shields.io/badge/OHCS-PASS-28a745)"
        else
          BADGE="![OHCS](https://img.shields.io/badge/OHCS-FAIL-dc3545)"
        fi
        sed -i "s|![OHCS].*|$BADGE|" README.md
        git config user.name "github-actions"
        git config user.email "actions@github.com"
        git commit -am "Update OHCS badge to $STATUS" || echo "No changes"
        git push || echo "No push on PR"
